# Known vulnerabilities in the Go standard library and in the module graph,
# filtered to the ones iXoSS's code can actually reach. It runs on a schedule
# as well as on changes, because a new advisory against code that has not
# changed is exactly the case a push-triggered check never sees.
#
# It runs on Alpine for the same reason the build does: govulncheck type-checks
# every package, the cgo ones included, so it needs the libvips headers, and the
# standard library it checks is the Go from golang:1.26-alpine3.23, the image
# the release is built with. That tag floats to the newest 1.26.x, so a finding
# here that a new patch release fixes clears on the next run by itself.
name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Alpine 3.23)
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: govulncheck
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e CGO_ENABLED=1 \
            golang:1.26-alpine3.23 \
            sh -eu -c '
              apk add --no-cache build-base pkgconf vips-dev
              go version
              # govulncheck@latest floats, so a release may one day need a newer
              # Go than the one in the image; auto lets the install fetch it.
              # The scan below still runs on the image Go, so the standard
              # library it checks is the one releases use.
              GOTOOLCHAIN=auto GOBIN=/tmp/bin go install golang.org/x/vuln/cmd/govulncheck@latest
              /tmp/bin/govulncheck ./...
            '
