# iXoSS builds against libvips through cgo, so "it compiles" is a claim about a
# specific libvips, not about Go. This runs the build and the tests on the
# platform README.md documents as the target: Alpine 3.23, with vips-heif and
# vips-jxl present, because a libvips without those dynamic modules passes
# startup and then fails the first format,avif request.
#
# The compiler runs in a container started by `docker run` rather than in the
# job's own `container:`, deliberately. A job container on Alpine has to run the
# checkout action's glibc Node under musl, which is a problem worth not having:
# this way the checkout happens on the runner and only the build sees Alpine.
#
# Go comes from the official golang:1.26-alpine3.23 image rather than from apk.
# The tag names no patch release, so every run gets the newest 1.26.x and its
# security fixes; apk only moves Go when Alpine rebuilds the package (Alpine 3.23
# still ships 1.25). libvips and the C toolchain still come from Alpine 3.23.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpine:
    name: build and test (Alpine 3.23)
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          # Written from inside the container, so these are the mounted paths
          # rather than the runner's own ~/go.
          path: |
            .ci-cache/go-mod
            .ci-cache/go-build
          key: golang126-alpine323-${{ hashFiles('go.sum') }}
          restore-keys: golang126-alpine323-

      - name: Build, vet, staticcheck and test
        run: |
          mkdir -p .ci-cache/go-mod .ci-cache/go-build
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$PWD/.ci-cache/go-mod:/gomod" \
            -v "$PWD/.ci-cache/go-build:/gocache" \
            -e GOMODCACHE=/gomod \
            -e GOCACHE=/gocache \
            -e CGO_ENABLED=1 \
            golang:1.26-alpine3.23 \
            sh -eu -c '
              apk add --no-cache build-base pkgconf vips-dev vips-heif vips-jxl
              go version
              pkg-config --modversion vips
              go build ./...
              go vet ./...
              # staticcheck v0.8.1 requires Go 1.26.0, which the image provides.
              # The image pins GOTOOLCHAIN=local, so a later bump of the tool
              # past the image Go fails here loudly instead of fetching a
              # toolchain the check would then not run on.
              GOBIN=/tmp/bin go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
              /tmp/bin/staticcheck ./...
              go test ./internal/...
            '

      - name: Restore cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ci-cache

  # staticcheck runs in the step above rather than here: it type-checks the cgo
  # packages, which needs the libvips headers just as the compiler does.
  #
  # gofmt and the module graph need no libvips, so they run on the runner and
  # fail in seconds rather than after an apk install.
  tidy:
    name: gofmt and go.mod
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
